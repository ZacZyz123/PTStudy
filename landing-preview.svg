-family="sans-serif">classmates and fight for the top of the leaderboard.</text><rect x="80" y="464" width="270" height="54" rx="27" fill="#38BDF8"/><text x="215" y="497" font-size="16" font-weight="700" fill="#0C1322" text-anchor="middle" font-family="sans-serif">Start studying — $25/mo →</text><text x="380" y="497" font-size="14" font-weight="400" fill="#A6B4C6" text-anchor="start" font-family="sans-serif">See what’s inside ↓</text><text x="80" y="575" font-size="30" font-weight="700" fill="#38BDF8" text-anchor="start" font-family="monospace">60s</text><text x="80" y="598" font-size="12" font-weight="400" fill="#A6B4C6" text-anchor="start" font-family="sans-serif">Lecture → study kit</text><text x="250" y="575" font-size="30" font-weight="700" fill="#38BDF8" text-anchor="start" font-family="monospace">15</text><text x="250" y="598" font-size="12" font-weight="400" fill="#A6B4C6" text-anchor="start" font-family="sans-serif">Flashcards per lecture</text><text x="420" y="575" font-size="30" font-weight="700" fill="#38BDF8" text-anchor="start" font-family="monospace">100 XP</text><text x="420" y="598" font-size="12" font-weight="400" fill="#A6B4C6" text-anchor="start" font-family="sans-serif">Per challenge win</text><ellipse cx="1080" cy="375" rx="220" ry="220" fill="url(#ped)"/><svg x="905" y="150" width="350" height="420" viewBox="0 0 200 240">
